
spring:
  application:
    name: tracepilot-backend

  ai:
    model:
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen3:4b
        think: false
        options:
          temperature: 0.2
          num-ctx: 4096
          num-predict: 256
      embedding:
        model: embeddinggemma
        keep-alive: "0"
        truncate: false
      init:
        pull-model-strategy: never

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 90s

  profiles:
    default: simulator
tracepilot:
  llm:
    max-transient-retries: 1
    retry-backoff: 500ms
    # Configuration limit, enforced by an outer request deadline
    request-deadline: 100s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info


