
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tracepilot}
    username: ${DB_USERNAME:tracepilot}
    password: local-dev-only-password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
