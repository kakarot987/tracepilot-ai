
name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 21 / Maven Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tracepilot-backend

    env:
      TRACEPILOT_LIVE_OLLAMA: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tracepilot-backend/pom.xml

      - name: Validate Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw --version

      - name: Compile, test, and package
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: tracepilot-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
