
name: tracepilot-ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tracepilot-ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:11435:11434"

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    volumes:
      - ollama_data:/root/.ollama

    gpus: all

    networks:
      - tracepilot-network


  backend:
    build:
      context: ../tracepilot-backend
      dockerfile: Dockerfile

    container_name: tracepilot-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    depends_on:
      - ollama

    networks:
      - tracepilot-network


volumes:
  ollama_data:

networks:
  tracepilot-network:
    driver: bridge
