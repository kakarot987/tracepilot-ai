
name: tracepilot-ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tracepilot-ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:11435:11434"

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    volumes:
      - ollama_data:/root/.ollama

    gpus: all

    networks:
      - tracepilot-network


  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: tracepilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tracepilot
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tracepilot -d tracepilot
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - tracepilot-network

  backend:
    build:
      context: ../tracepilot-backend
      dockerfile: Dockerfile

    container_name: tracepilot-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      DB_URL: jdbc:postgresql://postgres:5432/tracepilot
      DB_USERNAME: tracepilot
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

    networks:
      - tracepilot-network


volumes:
  ollama_data:
  postgres_data:

networks:
  tracepilot-network:
    driver: bridge
