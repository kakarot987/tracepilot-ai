
name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tracepilot-backend

    steps:
      - uses: actions/checkout@v4

      - name: Validate deterministic evaluation fixtures
        working-directory: .
        run: python3 -m unittest discover -s evaluations -p 'test_*.py'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tracepilot-backend/pom.xml

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify
